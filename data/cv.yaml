summary:
  pt: >-
    Engenheiro de Software com mais de 5 anos de experiência construindo e escalando
    aplicações web e mobile com React, React Native, TypeScript, Node.js e tecnologias
    frontend modernas. Experiência em arquitetura de software, otimização de performance,
    plataformas de assinatura, integrações de APIs e CI/CD. Atualmente atua em plataformas
    de e-commerce de grande escala do ecossistema Nestlé, incluindo soluções de assinatura
    em Magento, integrações B2B e plataformas internas. Liderou a arquitetura de aplicações
    mobile e entregou produtos com mais de 50.000 downloads.
  en: >-
    Software Engineer with 5+ years of experience building and scaling web and mobile
    applications using React, React Native, TypeScript, Node.js, and modern frontend
    technologies. Experienced in software architecture, performance optimization,
    subscription-based platforms, API integrations, and CI/CD. Currently contributing to
    large-scale e-commerce platforms within the Nestlé ecosystem, including Magento-based
    subscription solutions, B2B integrations, and internal platforms. Proven experience
    leading mobile application architecture and delivering products with over 50,000
    downloads.

