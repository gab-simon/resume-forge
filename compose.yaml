services:
  resume-forge:
    image: resume-forge:latest

    container_name: resume-forge
    restart: unless-stopped

    build:
      dockerfile: Dockerfile
      context: .

    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app

    ports:
      - "9000:8000"

    env_file:
      - .env

    environment:
      WATCHFILES_FORCE_POLLING: "true"
      DB_URL: ${DB_URL_DOCKER}

    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data
      - ./templates:/app/templates:ro
      - ./build:/app/build

    networks:
      - resume-forge-network

networks:
  resume-forge-network:
    name: resume-forge-network
