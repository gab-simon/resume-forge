repos:
  # Hooks from pre-commit.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
  # Ruff hooks for linting and formatting Python code.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.0
    hooks:
      # Run the linter.
      - id: ruff-check
        files: "^(app/|tests/)"
      # Run the formatter.
      - id: ruff-format
        files: "^(app/|tests/)"
  # Ty hooks for type checking Python code.
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.86
    hooks:
      - id: ty
        files: "^(app/|tests/)"
